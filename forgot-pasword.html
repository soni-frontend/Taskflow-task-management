<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password</title>
  <style>
    body { font-family: Arial; display:flex; justify-content:center; align-items:center; height:100vh; background:#f2f2f2; margin:0; }
    .box { background:white; padding:30px; border-radius:10px; width:340px; box-shadow:0 0 15px rgba(0,0,0,0.1); }
    h2 { text-align:center; color:#333; }
    input { width:100%; padding:12px; margin:10px 0; border-radius:6px; border:1px solid #ccc; box-sizing: border-box; }
    button { width:100%; padding:12px; background:#667eea; color:white; border:none; border-radius:6px; cursor:pointer; font-size:16px; margin-top:10px; }
    button:hover { background:#5a67d8; }
    a { color:#667eea; text-decoration:none; font-size:14px; }
    #msg { text-align:center; margin-top:15px; font-size:14px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Reset Password</h2>
    <p style="font-size:13px; color:#666; text-align:center;">Apna registered email aur naya password dalo</p>
    
    <input type="email" id="email" placeholder="Registered Email" required>
    <input type="password" id="newPassword" placeholder="New Password" required>
    <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
    
    <button onclick="resetPassword()">Reset Password</button>
    <p id="msg"></p>
    <p style="text-align:center; margin-top:15px;"><a href="index.html">← Back to Login</a></p>
  </div>

<script>
async function resetPassword(){
  const email = document.getElementById("email").value;
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const msg = document.getElementById("msg");

  if(!email || !newPassword || !confirmPassword){
    msg.style.color = "red";
    msg.innerText = "Please fill all fields";
    return;
  }

  if(newPassword !== confirmPassword){
    msg.style.color = "red";
    msg.innerText = "Password match nahi ho raha!";
    return;
  }

  try {
    const res = await fetch("http://localhost:5000/forgot-password", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ email, newPassword })
    });
    
    const data = await res.json();
    
    if(res.ok){
      msg.style.color = "green";
      msg.innerText = data.message + " Ab login kar sakte ho.";
    } else {
      msg.style.color = "red";
      msg.innerText = data.message;
    }
  } catch (err){
    msg.style.color = "red";
    msg.innerText = "Server not running!";
  }
}
</script>
</body>
</html>
